<title>Chord Live Pro</title>
<meta name="theme-color" content="#121318">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: instrumento a pantalla completa — barra superior fija, zona de teclado y zona de pads repartidas con flex */
:root{
  --bg:#101116; --bar:#18191f; --bar-line:#272932; --panel:#1d1f27; --panel-2:#252833;
  --ink:#eceef4; --ink-dim:#9298a8; --ink-faint:#5d6272;
  --accent:#f0a83a; --accent-ink:#1b1305; --rec:#ff4b3e; --sel:#7cc6ff;
  --ivory:#fbfaf6; --pad-top:#ffffff; --pad-cell:#ecebe7; --pad-bass:#bdbcb8;
  --black-key:#15161a; --sheet:#f6f6f8; --sheet-ink:#1c1e25; --sheet-dim:#6a6f7d; --sheet-line:#e1e2e7;
  --f-ui:"Outfit",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-chord:"Bricolage Grotesque","Outfit",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden;overscroll-behavior:none}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;touch-action:none}

/* ---------- barra superior ---------- */
.topbar{flex:0 0 auto;height:52px;display:flex;align-items:center;gap:2px;background:var(--bar);border-bottom:1px solid var(--bar-line);
  padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tb{width:48px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--ink);position:relative;flex:0 0 auto}
.tb svg{width:26px;height:26px}
.tb:active{background:var(--panel-2)}
.tb.on{color:var(--accent)}
.tb.on::after{content:"";position:absolute;bottom:3px;left:50%;width:14px;height:3px;margin-left:-7px;border-radius:2px;background:var(--accent)}
.sep{width:1px;height:28px;background:var(--bar-line);margin:0 4px;flex:0 0 auto}
.spacer{flex:1 1 auto;min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;overflow:hidden}
.recdot{width:24px;height:24px;border-radius:50%;background:var(--rec);box-shadow:0 0 0 3px rgba(255,75,62,.18)}
#btnRec.recording .recdot{border-radius:5px;width:20px;height:20px;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(255,75,62,.0),0 0 14px rgba(255,75,62,.7)}}
.rectime{font-variant-numeric:tabular-nums;font-weight:600;color:var(--rec);font-size:15px}
.brand{font-family:var(--f-chord);font-weight:800;font-size:15px;letter-spacing:.02em;color:var(--ink-faint);white-space:nowrap}
.brand b{color:var(--accent)}
.fxbadge{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--panel-2);color:var(--ink-dim)}
.tb.on .fxbadge{background:var(--accent);color:var(--accent-ink)}
.tb.fxb.on::after{display:none}
.beat{width:8px;height:8px;border-radius:50%;background:var(--panel-2);flex:0 0 auto}
.beat.hit{background:var(--accent)} .beat.hit.acc{background:var(--rec)}
@media (max-width:620px){ .tb{width:40px} .tb svg{width:22px;height:22px} .brand{display:none} .sep{margin:0 1px} }
@media (max-width:420px){ .tb{width:34px} }

/* ---------- escenario ---------- */
#stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.kbwrap{display:flex;flex-direction:column;min-height:0;flex:1 1 0;background:#0c0d10}
.kbwrap.rot{transform:rotate(180deg)}
.kbwrap + .kbwrap{border-top:4px solid var(--bar-line)}
.kbwrap.rot + .kbwrap{border-top:6px solid var(--accent)}
.strip{flex:0 0 40px;display:flex;align-items:center;gap:4px;padding:3px max(6px,env(safe-area-inset-right,0px)) 3px max(6px,env(safe-area-inset-left,0px));background:var(--bar)}
.sb{width:34px;height:34px;border-radius:50%;background:#0b0c0f;border:1px solid #2c2f39;display:grid;place-items:center;flex:0 0 auto;color:var(--ink)}
.sb svg{width:16px;height:16px}
.sb:active{background:var(--panel-2)}
.mini{position:relative;flex:1 1 auto;height:30px;min-width:0;border-radius:4px;overflow:hidden;background:#000}
.mini canvas{width:100%;height:100%;display:block;opacity:.45}
.mini .win{position:absolute;top:0;bottom:0;border:2px solid var(--accent);border-radius:3px;background:rgba(255,255,255,.18);box-shadow:0 0 12px rgba(240,168,58,.4);pointer-events:none}
.locked .mini .win{border-color:var(--ink-faint);box-shadow:none}
.keys{position:relative;flex:1 1 auto;min-height:0;overflow:hidden;touch-action:none;background:#0c0d10;border-top:2px solid #000}
.kin{position:absolute;top:0;left:0;bottom:0;will-change:transform}
.wk{position:absolute;top:0;bottom:0;background:linear-gradient(#f3f1ea,var(--ivory) 12%,var(--ivory) 88%,#e7e4da);border-right:1px solid #9d9a91;border-radius:0 0 7px 7px;box-shadow:inset 0 -6px 0 #dcd8cc}
.wk.down{background:linear-gradient(#d9d6cd,#ece9df);box-shadow:inset 0 -2px 0 #cfcabd}
.bk{position:absolute;top:0;height:60%;background:linear-gradient(90deg,#000,#2d2f36 45%,#141519);border-radius:0 0 5px 5px;box-shadow:0 4px 6px rgba(0,0,0,.55), inset 0 -8px 0 #24262c;z-index:2}
.bk.down{background:linear-gradient(90deg,#000,#3c3f49 50%,#1a1b20);box-shadow:0 1px 2px rgba(0,0,0,.5), inset 0 -3px 0 #2b2d34}
.lab{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);min-width:30px;padding:3px 5px;border-radius:4px;font-weight:600;font-size:clamp(10px,1.6vw,17px);text-align:center;color:#1d2a26;white-space:nowrap}
.wk.down .lab{filter:brightness(.9)}

/* ---------- pads de acordes ---------- */
#padArea{flex:1.25 1 0;min-height:0;display:flex;gap:8px;padding:8px max(8px,env(safe-area-inset-right,0px)) 8px max(6px,env(safe-area-inset-left,0px));
  background:radial-gradient(120% 140% at 30% 0%,#22252f,#111217 70%)}
.rail{flex:0 0 46px;display:flex;flex-direction:column;gap:8px}
.rb{width:46px;height:46px;border-radius:9px;background:linear-gradient(#3a3d47,#24262e);border:1px solid #444855;display:grid;place-items:center;color:#d9dbe2;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.rb svg{width:24px;height:24px}
.rb.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#banks{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:8px}
.bank{flex:1 1 0;min-height:0;display:flex;gap:6px}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:4px;padding:4px;border-radius:10px;background:var(--pad-top);box-shadow:0 2px 0 #9e9d99,0 4px 10px rgba(0,0,0,.35)}
.col.sel{background:#d6ecff;box-shadow:0 0 0 3px var(--sel),0 4px 10px rgba(0,0,0,.35)}
.cell{flex:1 1 0;min-height:0;border-radius:8px;background:var(--shade,#eee);transition:background .06s}
.cell.head{flex:1.05 1 0;min-height:22px;background:transparent;display:grid;place-items:center;font-family:var(--f-chord);font-weight:800;color:#15161b;font-size:clamp(12px,2.1vw,22px);letter-spacing:-.01em;overflow:hidden;white-space:nowrap}
.col.sel .cell.head{color:#0b5fae}
.cell.hit{background:#9fd5ff!important;box-shadow:inset 0 0 0 2px #5fb6f5}
.cell.head.hit{background:#cfe9ff!important}
.cell.bass{background:var(--shade,#bbb)}
.bank.compact .cell.head{font-size:clamp(11px,1.6vw,17px)}

/* ---------- selector de acordes ---------- */
#picker{flex:1 1 0;min-height:0;display:flex;flex-direction:column;background:#20232c;border-bottom:3px solid #000}
.pk-title{flex:0 0 auto;text-align:center;padding:8px;color:var(--sel);font-weight:600;letter-spacing:.04em;background:#262a35;display:flex;align-items:center;justify-content:center;gap:12px}
.pk-title button{padding:6px 14px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px}
.pk-body{flex:1 1 auto;min-height:0;display:flex;gap:6px;justify-content:center;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.pk-col{position:relative;flex:0 1 220px;min-width:0;overflow-y:auto;border-radius:8px;background:#f1f1f3;touch-action:pan-y;scrollbar-width:thin}
.pk-col button{display:block;width:100%;padding:10px 4px;border-bottom:1px solid #d7d8dd;color:#1d1f26;font-size:17px;font-weight:500}
.pk-col button.on{background:#bfc2ca;font-weight:700}
.pk-hint{flex:0 0 auto;text-align:center;font-size:12px;color:var(--ink-dim);padding:0 8px 6px}

/* ---------- hojas / diálogos ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,6,10,.55);z-index:40;display:flex;align-items:center;justify-content:center;padding:16px}
.sheet{background:var(--sheet);color:var(--sheet-ink);border-radius:14px;max-width:760px;width:100%;max-height:calc(100% - 8px);overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.5);touch-action:pan-y}
.sheet h2{margin:0;padding:16px 20px 8px;font-size:19px;font-weight:600}
.opt{display:flex;align-items:center;gap:16px;width:100%;padding:13px 20px;text-align:left;font-size:17px;color:var(--sheet-ink)}
.opt:active{background:#e8e9ee}
.opt .ico{width:40px;height:40px;display:grid;place-items:center;color:var(--sheet-ink)}
.opt .ico svg{width:34px;height:34px}
.radio{width:24px;height:24px;border-radius:50%;border:2.5px solid #7a7f8c;flex:0 0 auto;display:grid;place-items:center}
.opt.on .radio{border-color:#1f6fb8}
.opt.on .radio::after{content:"";width:12px;height:12px;border-radius:50%;background:#1f6fb8}
.instgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:4px;padding:12px}
.inst{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:12px;font-size:15px;color:var(--sheet-ink)}
.inst svg{width:64px;height:52px}
.inst.on{background:#dfeeff;box-shadow:inset 0 0 0 2px #7cb6ea}
.inst:active{background:#e6e7ec}

.drawer-scrim{justify-content:flex-end;align-items:stretch;padding:0}
.drawer{width:min(430px,92%);height:100%;background:var(--sheet);color:var(--sheet-ink);overflow:auto;touch-action:pan-y;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px);box-shadow:-10px 0 40px rgba(0,0,0,.45)}
.dsec{padding:14px 20px 6px;font-weight:600;font-size:17px;border-bottom:2px solid #5aa6e8;margin:0 6px}
.drow{display:flex;align-items:center;gap:12px;padding:10px 20px;min-height:58px;font-size:16px;border-bottom:1px solid var(--sheet-line)}
.drow > span{flex:1 1 auto;min-width:0}
.drow small{display:block;color:var(--sheet-dim);font-size:13px;margin-top:2px}
.step{display:flex;border:1.5px solid #c9ccd4;border-radius:10px;overflow:hidden;flex:0 0 auto}
.step button{width:48px;height:40px;font-size:24px;color:#4f5462;display:grid;place-items:center}
.step button + button{border-left:1.5px solid #c9ccd4}
.step button:active{background:#e3e4e9}
.sw{width:64px;height:34px;flex:0 0 auto;border-radius:4px;background:#cfd1d6;position:relative;border:1px solid #c0c2c8}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:28px;height:28px;border-radius:3px;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:left .15s}
.sw.on{background:#1f78c8;border-color:#1f78c8}
.sw.on::after{left:32px}
.dlink{display:flex;align-items:center;gap:16px;width:100%;padding:16px 20px;font-size:17px;text-align:left;color:var(--sheet-ink);border-bottom:1px solid var(--sheet-line)}
.dlink svg{width:30px;height:30px;color:#4d5260}
.dlink:active{background:#e8e9ee}
.val{min-width:28px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}

.settings .shead{position:sticky;top:0;display:flex;align-items:center;gap:14px;padding:14px 16px;background:#1f5f94;color:#fff;font-size:19px;font-weight:600;z-index:1}
.settings .shead button{width:36px;height:36px;display:grid;place-items:center;color:#fff}
.sgroup{padding:16px 20px 4px;color:#1f5f94;font-weight:600;font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.srow{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--sheet-line)}
.srow > div{flex:1 1 auto;min-width:0}
.srow b{display:block;font-weight:500;font-size:16px}
.srow small{display:block;color:var(--sheet-dim);font-size:13px;margin-top:2px}
.srow input[type=range]{width:100%;accent-color:#1f78c8;margin-top:8px}
.srow select{font:inherit;padding:6px 10px;border-radius:8px;border:1px solid #c9ccd4;background:#fff;color:var(--sheet-ink)}
.chk{width:26px;height:26px;border-radius:5px;border:2.5px solid #7a7f8c;flex:0 0 auto;display:grid;place-items:center}
.chk.on{background:#1f6fb8;border-color:#1f6fb8}
.chk.on::after{content:"";width:12px;height:7px;border-left:3px solid #fff;border-bottom:3px solid #fff;transform:rotate(-45deg) translate(1px,-2px)}
.btn{padding:10px 16px;border-radius:10px;background:#e3e5eb;color:var(--sheet-ink);font-weight:600}
.btn.pri{background:#1f6fb8;color:#fff}
.btn.danger{background:#ffe1de;color:#a3241a}

.recrow{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--sheet-line)}
.recrow input{flex:1 1 auto;min-width:0;font:inherit;font-size:16px;border:1px solid transparent;border-radius:6px;padding:4px 6px;background:transparent;color:var(--sheet-ink)}
.recrow input:focus{border-color:#c9ccd4;background:#fff}
.recrow .meta{font-size:12px;color:var(--sheet-dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#e3e5eb;flex:0 0 auto;color:var(--sheet-ink)}
.ib svg{width:18px;height:18px}
.ib.play{background:#1f6fb8;color:#fff}
.ib.del.armed{background:#d93a2f;color:#fff}
.empty{padding:28px 20px;color:var(--sheet-dim);text-align:center;line-height:1.5}

.popover{position:fixed;z-index:45;background:var(--sheet);color:var(--sheet-ink);border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.5);width:min(320px,calc(100% - 24px));padding:6px 0;touch-action:pan-y}

#countIn{position:fixed;inset:0;z-index:60;display:grid;place-items:center;pointer-events:none}
#countIn span{font-family:var(--f-chord);font-weight:800;font-size:min(34vw,34vh);color:var(--rec);text-shadow:0 6px 40px rgba(0,0,0,.6)}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:#2b2e39;color:var(--ink);padding:10px 16px;border-radius:999px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.45);pointer-events:none;max-width:calc(100% - 32px);text-align:center}

#splash{position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));background:rgba(9,10,14,.82);backdrop-filter:blur(4px)}
.splash-in{text-align:center;max-width:520px}
.logo{font-family:var(--f-chord);font-weight:800;font-size:clamp(34px,7vw,64px);letter-spacing:-.02em;line-height:1;text-wrap:balance}
.logo span{color:var(--accent)}
.tag{color:var(--ink-dim);margin:12px 0 22px;font-size:16px;line-height:1.5}
.go{padding:16px 40px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:19px;box-shadow:0 8px 30px rgba(240,168,58,.35)}
.hint{margin-top:18px;font-size:13px;color:var(--ink-faint)}
select{font:inherit;padding:6px 8px;border-radius:8px;border:1px solid #c9ccd4;background:#fff;color:var(--sheet-ink);max-width:100%}
.instwrap{position:relative;display:flex}.instwrap .inst{flex:1}
.inst img{width:64px;height:64px;border-radius:14px;object-fit:cover;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.instdel{position:absolute;top:4px;right:4px;width:30px;height:30px;border-radius:50%;background:#e3e5eb;display:grid;place-items:center;color:#4d5260}
.instdel svg{width:15px;height:15px}.instdel.armed{background:#d93a2f;color:#fff}
.inst.more .plus{width:64px;height:52px;display:grid;place-items:center;font-size:44px;color:#8a8f9c;font-weight:300}
.ihint{margin:0;padding:0 20px 16px;color:var(--sheet-dim);font-size:13px}
.ni{display:flex;flex-direction:column;gap:14px;padding:4px 20px 18px}
.nis{display:flex;flex-direction:column;gap:6px}.nis small{color:var(--sheet-dim);font-size:13px}
.nirow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.nirow.end{justify-content:flex-end}.nirow select{flex:1 1 160px}
.ni input{font:inherit;font-size:16px;padding:8px 10px;border-radius:8px;border:1px solid #c9ccd4;background:#fff;color:var(--sheet-ink)}
.plist{max-height:34vh;overflow:auto;border:1px solid var(--sheet-line);border-radius:10px;background:#fff}
.pitem{display:flex;gap:10px;width:100%;padding:10px 12px;text-align:left;border-bottom:1px solid var(--sheet-line);color:var(--sheet-ink);font-size:15px}
.pitem span{color:var(--sheet-dim);font-variant-numeric:tabular-nums}.pitem.on{background:#dfeeff}
.iconprev{width:64px;height:64px;border-radius:14px;overflow:hidden;background:#e9eaee;display:grid;place-items:center}.iconprev img{width:100%;height:100%;object-fit:cover}.iconprev svg{width:56px;height:46px}
.rmain{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:3px}
.rmain input{width:100%}
.xrow{display:flex;gap:6px;flex-wrap:wrap}
.xb{padding:5px 10px;border-radius:999px;background:#e3e5eb;color:#1f5f94;font-weight:600;font-size:13px}
.xb:active{background:#cfd3dc}
.drow input[type=range]{width:100%;accent-color:#1f78c8;margin-top:8px}
.dver{padding:16px 20px 22px;color:var(--sheet-dim);font-size:13px;font-variant-numeric:tabular-nums}
.hint.ver{margin-top:6px;font-variant-numeric:tabular-nums}
.tb.playing{animation:dbeat 1s infinite}@keyframes dbeat{50%{opacity:.55}}
.dview{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:#15171d}
.dgrid-wrap{flex:1 1 auto;min-height:0;overflow:auto;touch-action:pan-y;padding:6px max(6px,env(safe-area-inset-right,0px)) 6px max(6px,env(safe-area-inset-left,0px))}
.dgrid{display:grid;grid-template-columns:minmax(84px,110px) repeat(var(--steps),minmax(26px,1fr));grid-auto-rows:minmax(38px,1fr);gap:4px}
.dgrid .dcorner,.dgrid .dcol{min-height:16px;height:16px}
.dcol{font-size:10px;color:var(--ink-faint);text-align:center;border-bottom:3px solid transparent;font-variant-numeric:tabular-nums}
.dcol.now{border-color:#3aa0ff;color:var(--ink)}
.dlabel{font-size:12px;color:var(--ink-dim);text-align:left;padding:0 6px;border-radius:6px;background:#1f222b;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dlabel:active{background:#2b2f3a}
.dcell{border-radius:5px;background:#7f93a4;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.dcell.alt{background:#9b98a6}
.dcell.hi{background:#ffd93d;box-shadow:0 0 10px rgba(255,217,61,.55)}
.dcell.lo{background:#e08f12}
.dbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));background:var(--bar);border-top:1px solid var(--bar-line)}
.dplay{width:44px;height:38px;border-radius:8px;background:var(--panel-2);display:grid;place-items:center}.dplay svg{width:18px;height:18px}.dplay.on{background:var(--accent);color:var(--accent-ink)}
.dbtns{display:flex;border:1px solid var(--bar-line);border-radius:8px;overflow:hidden}.dbtns button{padding:9px 12px;font-size:13px;color:var(--ink-dim)}.dbtns button+button{border-left:1px solid var(--bar-line)}
.dbar select{font:inherit;font-size:13px;padding:7px 8px;border-radius:8px;background:var(--panel-2);color:var(--ink);border:1px solid var(--bar-line)}

<script>
(()=>{
"use strict";
/* =================== utilidades =================== */
const APP_VERSION=(v=>v.startsWith('__')?'dev':v)('__APP_VERSION__');
const $=s=>document.querySelector(s);
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2200);}

/* =================== música =================== */
const NOTE_S=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const SOLF=['Do','Do#','Re','Re#','Mi','Fa','Fa#','Sol','Sol#','La','La#','Si'];
const ROOTS=['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];
const QUAL=[['maj','Maj',[0,4,7]],['min','Min',[0,3,7]],['dim','Dim',[0,3,6]],['aug','Aug',[0,4,8]],['sus2','Sus2',[0,2,7]],['sus4','Sus4',[0,5,7]]];
const EXT=[['none','None'],['6','6'],['7','7'],['maj7','Maj7'],['9','9'],['add9','add9'],['11','11'],['13','13']];
const isBlack=m=>[1,3,6,8,10].includes(m%12);
const WHITES=[],BLACKS=[];for(let m=21;m<=108;m++)(isBlack(m)?BLACKS:WHITES).push(m);
const wIndex=m=>WHITES.indexOf(m);
function ivs(c){const iv=[...QUAL.find(q=>q[0]===c.q)[2]];const d=c.q==='dim';
  switch(c.e){case'6':iv.push(9);break;case'7':iv.push(d?9:10);break;case'maj7':iv.push(11);break;case'9':iv.push(d?9:10,14);break;case'add9':iv.push(14);break;case'11':iv.push(10,14,17);break;case'13':iv.push(10,14,21);break;}
  return iv;}
function chordName(c){const r=ROOTS[c.r],q={maj:'',min:'m',dim:'dim',aug:'aug',sus2:'sus2',sus4:'sus4'}[c.q];
  if(c.e==='none')return r+q;
  if(c.q==='sus2'||c.q==='sus4')return r+(c.e==='add9'?'(add9)':c.e)+c.q;
  if(c.e==='maj7')return r+(c.q==='maj'?'maj7':c.q==='min'?'m(maj7)':q+'(maj7)');
  if(c.e==='add9')return r+q+'(add9)';
  return r+q+c.e;}
const rootMid=r=>r<7?60+r:48+r;
/* Notas de cada celda: arriba = acorde agudo, bajando = inversiones más graves, gris oscuro = bajo */
function cellNotes(c,kind,j){
  const iv=ivs(c),pcs=[...new Set(iv.map(i=>(i+c.r)%12))],rm=rootMid(c.r),fifth=iv[2];
  const tones=[];for(let m=33;m<=100;m++)if(pcs.includes(m%12))tones.push(m);
  if(kind==='head'){const i0=tones.findIndex(m=>m>=60);return [48+c.r,...tones.slice(i0,i0+Math.min(pcs.length+1,5))];}
  if(kind==='chord'){const n=Math.min(pcs.length+1,5);let i0=tones.findIndex(m=>m>=64)-j;while(tones[i0]<52)i0++;i0=Math.max(0,i0);return tones.slice(i0,i0+n);}
  const br=36+c.r;const seq=[br+12,br+fifth,br,br+fifth-12,br-12,br+fifth-24];return [Math.max(24,seq[j%seq.length])];
}

/* =================== patrones de ritmo =================== */
function pat(steps,rows){const g={};for(const [n,str] of Object.entries(rows))g[n]=[...str].map(ch=>ch==='x'?2:ch==='o'?1:0);return {steps,grid:g};}
const DPRESETS=[
  ['Pop',pat(16,{36:'x.......x.x.....',38:'....x.......x...',42:'x.o.x.o.x.o.x.o.'})],
  ['Balada',pat(16,{36:'x.........x.....',37:'....x.......x...',42:'x.o.o.o.x.o.o.o.'})],
  ['Rock',pat(16,{36:'x......xx.x.....',38:'....x.......x...',42:'x.x.x.x.x.x.x.x.',49:'x...............'})],
  ['Cumbia',pat(16,{36:'x.......x.......',38:'....x.......x...',73:'x.xxx.xxx.xxx.xx',42:'..x...x...x...x.'})],
  ['Reguetón',pat(16,{36:'x...x...x...x...',38:'...x..x....x..x.',42:'x.x.x.x.x.x.x.x.'})],
  ['Bachata',pat(16,{36:'x.......x.......',47:'......x.......x.',70:'xoxoxoxoxoxoxoxo',37:'..x...x...x...x.'})],
  ['Bossa nova',pat(16,{36:'x..xx..xx..xx..x',37:'x..x..x...x..x..',42:'xoxoxoxoxoxoxoxo'})],
  ['Funk',pat(16,{36:'x..x..x...x..x..',38:'....x..o.o..x...',42:'xoxoxoxoxoxoxoxo'})],
  ['Vals 3/4',pat(12,{36:'x...........',38:'....x...x...',42:'x.o.x.o.x.o.'})],
  ['Ranchera 2/4',pat(8,{36:'x...x...',38:'..x...x.',42:'x.x.x.x.'})]];
/* =================== ajustes =================== */
const C=(r,q='maj',e='none')=>({r,q,e});
const PRESETS=[
  [C(2,'min'),C(4,'min'),C(5),C(9,'min'),C(0),C(0,'min'),C(7),C(2)],
  [C(0),C(7),C(9,'min'),C(5),C(2,'min',),C(4,'maj','7'),C(10),C(9,'maj','7')],
  [C(9,'min'),C(2,'min'),C(4,'maj','7'),C(0,'maj','maj7'),C(5,'maj','maj7'),C(7,'maj','7'),C(11,'dim'),C(4,'min')],
  [C(7),C(2),C(4,'min'),C(0),C(11,'min'),C(9,'min','7'),C(6,'dim'),C(2,'sus4')]
];
const DEF={mode:'chords',labels:'name',inst:'piano',visible:15,reverb:true,reverbLevel:60,volume:80,sus:false,resonance:true,keyHold:85,padHold:100,
  vibrate:false,lock:false,countIn:true,metro:false,bpm:75,meter:4,kbHidden:false,chordCells:4,bassCells:3,perRow:8,
  quant:'off',latency:'low',cfgVer:4,kit:'acoustic',drumVol:80,swing:0,recDrums:true,pattern:JSON.parse(JSON.stringify(DPRESETS[0][1])),qStrength:100,banks:[PRESETS[0].map(c=>({...c}))],first1:wIndex(60),first2:wIndex(48)};
const S=Object.assign({},DEF,store.get('clp_settings',{}));
if((S.cfgVer||0)<4){S.latency='low';S.cfgVer=4;}
if(!Array.isArray(S.banks)||!S.banks.length)S.banks=DEF.banks;
const save=()=>store.set('clp_settings',S);

/* =================== motor de audio =================== */
const INST=[
  {id:'piano',name:'Acústico'},{id:'bright',name:'Brillante'},{id:'musicbox',name:'Caja de música'},{id:'organ',name:'Órgano'},
  {id:'rhodes',name:'Rhodes'},{id:'synth',name:'Sintetizador'},{id:'guitar',name:'Guitarra'}];
const WAVES={piano:[0,1,.55,.34,.2,.13,.08,.05,.035,.02],bright:[0,1,.75,.55,.42,.32,.24,.17,.12,.09,.06,.04],
  organ:[0,.55,1,0,.65,0,.42,0,.3],musicbox:[0,1,.08,0,.38,0,.12,0,.05],guitar:[0,1,.6,.42,.33,.25,.2,.16,.12,.09,.07,.05,.04]};
class Engine{
  constructor(ctx,opts={}){this.ctx=ctx;const c=ctx;this.out=c.createGain();this.waves={};this.live=[];
    if(opts.raw){this.raw=true;this.offline=true;this.out.connect(c.destination);return;}
    /* limitador: nada pasa de -1 dB aunque toques muchas notas */
    const comp=c.createDynamicsCompressor();comp.threshold.value=-8;comp.knee.value=0;comp.ratio.value=20;comp.attack.value=.001;comp.release.value=.12;
    this.lim=c.createGain();this.lim.gain.value=.78;
    this.dry=c.createGain();this.wet=c.createGain();this.drumBus=c.createGain();
    this.out.connect(this.dry);this.dry.connect(comp);this.drumBus.connect(comp);this.buildReverb();this.rvOut.connect(this.wet);this.wet.connect(comp);
    this.convOn=false;comp.connect(this.lim);this.lim.connect(c.destination);this.apply();}
  /* reverb liviana (4 ecos con realimentación), mucho más barata que la convolución */
  buildReverb(){const c=this.ctx;this.rvIn=c.createGain();this.rvOut=c.createGain();const pre=c.createBiquadFilter();pre.type='lowpass';pre.frequency.value=5000;this.rvIn.connect(pre);
    [.0297,.0371,.0411,.0437].forEach((dt,i)=>{const d=c.createDelay(.2);d.delayTime.value=dt;const fb=c.createGain();fb.gain.value=.8;const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=3200;
      pre.connect(d);d.connect(lp);lp.connect(fb);fb.connect(d);
      if(c.createStereoPanner){const pn=c.createStereoPanner();pn.pan.value=i%2?.6:-.6;lp.connect(pn);pn.connect(this.rvOut);}else lp.connect(this.rvOut);});
    this.rvOut.gain.value=.22;}
  impulse(sec){const sr=this.ctx.sampleRate,len=Math.floor(sr*sec),b=this.ctx.createBuffer(2,len,sr);
    for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);for(let i=0;i<len;i++){const k=i/len;d[i]=(Math.random()*2-1)*Math.pow(1-k,3.4)*(i<sr*.012?i/(sr*.012):1);}}return b;}
  apply(){if(this.raw)return;const L=S.reverbLevel/100,want=S.reverb&&L>0;if(want!==this.convOn){try{want?this.out.connect(this.rvIn):this.out.disconnect(this.rvIn);}catch(e){}this.convOn=want;}
    this.drumBus.gain.value=(S.drumVol??80)/100*.9;this.wet.gain.value=S.reverb?L*.45:0;this.dry.gain.value=S.reverb?1-L*.15:1;this.out.gain.value=S.volume/100*.85;}
  wave(n){if(!this.waves[n]){const a=WAVES[n];this.waves[n]=this.ctx.createPeriodicWave(new Float32Array(a.length),new Float32Array(a));}return this.waves[n];}
  play(midi,t,vel,inst,dest){
    if(inst==='drum')return this.playDrum(midi,t,vel,dest);
    if(inst&&inst.startsWith('sf:')){const ins=LOADED[inst];if(ins)return this.playSF(ins,midi,t,vel,dest);inst='piano';}
    if(!this.raw&&SAMPLES[inst]&&SAMPLES[inst].ready)return this.playSample(SAMPLES[inst],midi,t,vel,dest);
    const c=this.ctx,f=440*Math.pow(2,(midi-69)/12),g=c.createGain(),oscs=[];let tau=0,peak=vel*.17,held=false;
    g.gain.setValueAtTime(0,t);g.connect(dest||this.out);
    const pitchTau=base=>clamp(base*Math.pow(2,-(midi-60)/26),.25,base*2.2);
    if(inst==='piano'||inst==='bright'||inst==='guitar'||inst==='musicbox'){
      const o=c.createOscillator(),lp=c.createBiquadFilter();lp.type='lowpass';
      const ff=inst==='musicbox'?f*2:f;o.setPeriodicWave(this.wave(inst));o.frequency.value=ff;
      const open={piano:9,bright:16,guitar:12,musicbox:10}[inst],close={piano:3,bright:5,guitar:1.6,musicbox:4}[inst];
      lp.frequency.setValueAtTime(Math.min(18000,ff*open*(.6+vel*.6)),t);lp.frequency.setTargetAtTime(Math.min(16000,ff*close),t+.01,inst==='guitar'?.12:.35);
      o.connect(lp);lp.connect(g);oscs.push(o);
      tau={piano:pitchTau(2.2),bright:pitchTau(1.9),guitar:pitchTau(1.3),musicbox:pitchTau(.9)}[inst];
      if(inst==='musicbox')peak*=.8;
      g.gain.linearRampToValueAtTime(peak,t+.004);g.gain.setTargetAtTime(peak*.55,t+.004,.09);g.gain.setTargetAtTime(0,t+.09,tau);
    }else if(inst==='organ'){
      const o=c.createOscillator();o.setPeriodicWave(this.wave('organ'));o.frequency.value=f/2;o.connect(g);oscs.push(o);held=true;
      g.gain.linearRampToValueAtTime(peak*.62,t+.015);
    }else if(inst==='rhodes'){
      const car=c.createOscillator(),mod=c.createOscillator(),mg=c.createGain(),tine=c.createOscillator(),tg=c.createGain();
      car.frequency.value=f;mod.frequency.value=f;mg.gain.setValueAtTime(f*(1.4+vel*2.2),t);mg.gain.setTargetAtTime(f*.25,t,.35);
      mod.connect(mg);mg.connect(car.frequency);car.connect(g);
      tine.frequency.value=f*7.1;tg.gain.setValueAtTime(.12*vel,t);tg.gain.setTargetAtTime(0,t,.05);tine.connect(tg);tg.connect(g);
      oscs.push(car,mod,tine);tau=pitchTau(2.4);
      g.gain.linearRampToValueAtTime(peak*1.1,t+.006);g.gain.setTargetAtTime(0,t+.006,tau);
    }else{ // synth
      const lp=c.createBiquadFilter();lp.type='lowpass';lp.Q.value=5;lp.frequency.setValueAtTime(Math.min(16000,f*9),t);lp.frequency.setTargetAtTime(Math.min(12000,f*2.6+300),t+.01,.3);lp.connect(g);
      for(const d of [-8,8]){const o=c.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=d;o.connect(lp);oscs.push(o);}
      held=true;g.gain.linearRampToValueAtTime(peak*.55,t+.01);g.gain.setTargetAtTime(peak*.32,t+.02,.25);
    }
    oscs.forEach(o=>o.start(t));
    const natural=held?Infinity:t+tau*7+.2;if(isFinite(natural))oscs.forEach(o=>o.stop(natural));
    const v={g,oscs,end:natural,held,stopped:false,
      stop:(at,rt)=>{if(v.stopped)return;v.stopped=true;at=Math.max(at,t+.01);holdAt(g.gain,at);g.gain.setTargetAtTime(0,at,rt);const e=at+rt*7+.05;if(e<v.end){v.end=e;oscs.forEach(o=>{try{o.stop(e);}catch(_){}});}}};
    if(!dest||dest===this.out){this.live.push(v);this.prune();}
    return v;}
  /* nota pregrabada: un solo nodo por nota, casi no gasta procesador */
  playSample(set,midi,t,vel,dest){const c=this.ctx;let root=set.roots[0];for(const r of set.roots)if(Math.abs(r-midi)<Math.abs(root-midi))root=r;
    const buf=set.bufs[root],s=c.createBufferSource();s.buffer=buf;s.playbackRate.value=Math.pow(2,(midi-root)/12);
    const g=c.createGain(),amp=.3+.7*vel;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(amp,t+.003);s.connect(g);g.connect(dest||this.out);s.start(t);
    const natural=t+buf.duration/s.playbackRate.value;s.stop(natural);
    const v={g,oscs:[s],end:natural,held:set.held,stopped:false,
      stop:(at,rt)=>{if(v.stopped)return;v.stopped=true;at=Math.max(at,t+.005);holdAt(g.gain,at);g.gain.setTargetAtTime(0,at,rt);const e=at+rt*7+.05;if(e<v.end){v.end=e;try{s.stop(e);}catch(_){}}}};
    if(!dest||dest===this.out){this.live.push(v);this.prune();}return v;}
  playDrum(note,t,vel,dest){const kit=DRUMS[S.kit]||DRUMS.acoustic;const buf=kit&&kit.bufs&&kit.bufs[note];if(!buf)return {stop(){},end:t,held:false};
    const c=this.ctx,s=c.createBufferSource(),g=c.createGain();s.buffer=buf;g.gain.value=vel;s.connect(g);g.connect(dest||this.drumBus||this.out);s.start(t);return {stop(){},end:t+buf.duration,held:false};}
  playSF(ins,midi,t,vel,dest){
    const c=this.ctx,v127=Math.round(vel*127);let rs=ins.regions.filter(r=>midi>=r.klo&&midi<=r.khi&&v127>=r.vlo&&v127<=r.vhi);
    if(!rs.length){let best=1e9;for(const r of ins.regions){const d=midi<r.klo?r.klo-midi:midi>r.khi?midi-r.khi:0;if(d<best)best=d;}
      rs=ins.regions.filter(r=>(midi<r.klo?r.klo-midi:midi>r.khi?midi-r.khi:0)===best);}
    const g=c.createGain();g.connect(dest||this.out);const srcs=[];let end=t,held=false,rel=.05;
    for(const r of rs){const s=c.createBufferSource();s.buffer=r.buf;const semis=(midi-r.root)*r.scale/100+r.tune/100;s.playbackRate.value=Math.pow(2,semis/12);
      if(r.loop&&r.le>r.ls+8){s.loop=true;s.loopStart=(r.ls-r.start)/r.rate;s.loopEnd=(r.le-r.start)/r.rate;held=true;}
      const amp=Math.pow(10,-r.att*.4/200)*vel*vel*.45,eg=c.createGain(),a=Math.max(.002,r.env.a),h=r.env.h;
      eg.gain.setValueAtTime(0,t);eg.gain.linearRampToValueAtTime(amp,t+a);eg.gain.setValueAtTime(amp,t+a+h);eg.gain.setTargetAtTime(amp*r.env.s,t+a+h,Math.max(.01,r.env.d/5));
      s.connect(eg);if(r.pan&&c.createStereoPanner){const p=c.createStereoPanner();p.pan.value=r.pan;eg.connect(p);p.connect(g);}else eg.connect(g);
      s.start(t);srcs.push(s);rel=Math.max(rel,Math.min(3,r.env.r));

const SAMPLES={};

    const all=(await off.startRendering()).getChannelData(0);let pk=0;for(let i=0;i<all.length;i++){const a=Math.abs(all[i]);if(a>pk)pk=a;}
    const k=pk>0?.32/pk:1,bufs={},n=Math.floor(sr*D);

/* =================== lector de SoundFont (.sf2) =================== */
const SF2={
  parse(buf){const dv=new DataView(buf),u8=new Uint8Array(buf);
    const str=(o,n)=>{let s='';for(let i=0;i<n;i++){const c=u8[o+i];if(!c)break;s+=String.fromCharCode(c);}return s.trim();};

    let smpl=0;const pd={};

      if(id==='LIST')walk(o+12,Math.min(end,o+8+sz));else if(id==='smpl')smpl=o+8;else if(/^(phdr|pbag|pgen|inst|ibag|igen|shdr)$/.test(id))pd[id]={o:o+8,n:sz};
      o+=8+sz+(sz&1);}};
    walk(12,Math.min(buf.byteLength,8+dv.getUint32(4,true)));
    for(const k of ['phdr','pbag','pgen','inst','ibag','igen','shdr'])if(!pd[k])throw new Error('SoundFont incompleto (falta '+k+')');
    const recs=(k,size,f)=>{const r=[],{o,n}=pd[k];for(let i=0;i<Math.floor(n/size);i++)r.push(f(o+i*size));return r;};
    const gen=k=>recs(k,4,o=>({s:dv.getInt16(o+2,true),u:dv.getUint16(o+2,true),lo:u8[o+2],hi:u8[o+3],op:dv.getUint16(o,true)}));
    const sf={dv,smpl,
      phdr:recs('phdr',38,o=>({name:str(o,20),program:dv.getUint16(o+20,true),bank:dv.getUint16(o+22,true),bag:dv.getUint16(o+24,true)})),
      pbag:recs('pbag',4,o=>dv.getUint16(o,true)),pgen:gen('pgen'),
      inst:recs('inst',22,o=>({name:str(o,20),bag:dv.getUint16(o+20,true)})),
      ibag:recs('ibag',4,o=>dv.getUint16(o,true)),igen:gen('igen'),
      shdr:recs('shdr',46,o=>({start:dv.getUint32(o+20,true),end:dv.getUint32(o+24,true),ls:dv.getUint32(o+28,true),le:dv.getUint32(o+32,true),rate:dv.getUint32(o+36,true),pitch:u8[o+40],corr:dv.getInt8(o+41)}))};
    sf.presets=sf.phdr.slice(0,-1).map((p,i)=>({i,name:p.name||('Preset '+i),bank:p.bank,program:p.program})).sort((a,b)=>a.bank-b.bank||a.program-b.program);

  zones(bags,gens,b0,b1){const z=[];for(let b=b0;b<b1&&b+1<bags.length;b++){const m={};for(let g=bags[b];g<bags[b+1]&&g<gens.length;g++)m[gens[g].op]=gens[g];z.push(m);}return z;},

  /* Convierte un preset en regiones con su sample ya decodificado (AudioBuffer) */
  regions(sf,pi){const p=sf.phdr[pi];if(!p||!sf.phdr[pi+1])throw new Error('Preset no encontrado');

const GM={piano:0,bright:1,musicbox:10,organ:16,rhodes:4,synth:81,guitar:24};

  const vlq=n=>{const b=[n&0x7f];while(n>>=7)b.unshift((n&0x7f)|0x80);return b;};
  const tr=[],tempo=Math.round(60000000/bpm),name=[...(rec.name||'Chord Live Pro').normalize('NFD').replace(/[\u0300-\u036f]/g,'')].map(c=>c.charCodeAt(0)&0x7f).slice(0,60);

    bank.forEach((ch,ci)=>{const col=el('div','col'+(editing&&editing.b===bi&&editing.c===ci?' sel':''));
      const hd=el('div','cell head',chordName(ch));Object.assign(hd.dataset,{b:bi,c:ci,k:'head',j:0});col.appendChild(hd);
      for(let j=0;j<S.chordCells;j++){const x=el('div','cell');Object.assign(x.dataset,{b:bi,c:ci,k:'chord',j});x.style.setProperty('--shade',shadeFor('chord',j));col.appendChild(x);}
      for(let j=0;j<S.bassCells;j++){const x=el('div','cell bass');Object.assign(x.dataset,{b:bi,c:ci,k:'bass',j});x.style.setProperty('--shade',shadeFor('bass',j));col.appendChild(x);}
      row.appendChild(col);});
    banks.appendChild(row);});
  area.append(rail,banks);
  // toque en pads (multitáctil, deslizar para rasguear)
  const act=new Map();let lp=null;
  const trig=(id,cell)=>{const d=cell.dataset,ch=S.banks[d.b][d.c];
    if(editing&&d.k==='head'){editing={b:+d.b,c:+d.c};render();previewChord();return;}
    const notes=cellNotes(ch,d.k,+d.j),gap=d.k==='head'?.018:.007,vel=d.k==='bass'?.8:.68;
    const nv=vel*Math.min(1,1.7/Math.sqrt(notes.length));const hs=notes.map((m,i)=>noteOn(m,nv*(i===0&&d.k!=='bass'?.92:1),i*gap));
    cell.classList.add('hit');act.set(id,{cell,hs});buzz();};
  const rel=(id,soft)=>{const a=act.get(id);if(!a)return;act.delete(id);a.hs.forEach(h=>noteOff(h,'pad',soft));
    if(![...act.values()].some(x=>x.cell===a.cell))a.cell.classList.remove('hit');};
  banks.addEventListener('pointerdown',e=>{const cell=e.target.closest('.cell');if(!cell||(REC&&REC.waiting))return;e.preventDefault();
    try{banks.setPointerCapture(e.pointerId);}catch(_){}
    trig(e.pointerId,cell);
    if(cell.dataset.k==='head'&&!editing){clearTimeout(lp);const d=cell.dataset;lp=setTimeout(()=>{rel(e.pointerId);editing={b:+d.b,c:+d.c};render();toast('Elige el acorde arriba y pulsa Listo');},550);}});
  banks.addEventListener('pointermove',e=>{const a=act.get(e.pointerId);if(!a)return;const t=document.elementFromPoint(e.clientX,e.clientY);const cell=t&&t.closest&&t.closest('#banks .cell');
    if(cell&&cell!==a.cell){clearTimeout(lp);rel(e.pointerId);trig(e.pointerId,cell);}});
  const up=e=>{clearTimeout(lp);rel(e.pointerId,e.type==='pointercancel');};
  ['pointerup','pointercancel','lostpointercapture'].forEach(n=>banks.addEventListener(n,up));
  return area;
}
function previewChord(){if(!editing)return;const ch=S.banks[editing.b][editing.c];cellNotes(ch,'head').forEach((m,i)=>{const h=noteOn(m,.6,i*.018);setTimeout(()=>noteOff(h,'pad'),700);});}

const DM={playing:false,timer:null,next:0,step:0};

async function dmStart(at){audio();await prepareDrums(S.kit);DM.playing=true;DM.step=0;DM.next=at!=null?at:ctx.currentTime+.06;clearInterval(DM.timer);DM.timer=setInterval(dmTick,25);dmTick();syncTop();updDmPlay();}

function dmTick(){if(!ctx||!DM.playing)return;const P=S.pattern,st=stepDur();
  while(DM.next<ctx.currentTime+.12){const i=DM.step%P.steps,t=DM.next+((i%2)?st*(S.swing||0)/100*.66:0);
    for(const r of DROWS){const v=(P.grid[r.n]||[])[i];if(!v)continue;const vel=v===2?1:.5;E.playDrum(r.n,t,vel);
      if(REC&&REC.drums&&t>=REC.t0-.001)REC.events.push({t:+Math.max(0,t-REC.t0).toFixed(4),m:r.n,v:vel,i:'drum',d:null,r:null});}
    const ms=Math.max(0,(t-ctx.currentTime)*1000);setTimeout(()=>{const cols=document.querySelectorAll('.dcol');cols.forEach((c,k)=>c.classList.toggle('now',k===i&&DM.playing));},ms);
    DM.next+=st;DM.step++;}}

    <div class="drow"><span>Fuerza: <b class="val" id="mQSv">${S.qStrength}%</b><input type="range" id="mQS" min="10" max="100" step="10" value="${S.qStrength}"></span></div>
    <div style="height:6px"></div>
    <button class="dlink" id="mRecs">${IC.folder}Lista de grabaciones</button>
    <button class="dlink" id="mSet">${IC.gear}Ajustes</button>
    <button class="dlink" id="mFull">${IC.full}Pantalla completa</button>
    <div class="dver">Chord Live Pro · versión ${APP_VERSION}</div>`,{drawer:true});
  b.querySelectorAll('[data-sw]').forEach(s=>s.onclick=()=>{const k=s.dataset.sw;S[k]=!S[k];s.classList.toggle('on',S[k]);save();if(E)E.apply();syncTop();keyboards.forEach(x=>x.position());});
  b.querySelectorAll('[data-st]').forEach(s=>s.onclick=()=>{const k=s.dataset.st,[lo,hi]=LIMITS[k];const v=clamp(S[k]+(+s.dataset.d),lo,hi);if(v===S[k])return;S[k]=v;
    if(k==='rows'){while(S.banks.length<v){const p=PRESETS[S.banks.length%PRESETS.length];S.banks.push(Array.from({length:S.perRow},(_,i)=>({...p[i%p.length]})));}S.banks.length=v;if(v>1&&!S.kbHidden&&S.mode==='chords'){S.kbHidden=true;toast('Teclado oculto para dar espacio; muéstralo con la flecha');}}
    if(k==='perRow'){S.banks.forEach((bk,bi)=>{const p=PRESETS[bi%PRESETS.length];while(bk.length<v)bk.push({...p[bk.length%p.length]});bk.length=v;});}
    b.querySelector(`[data-val="${k}"]`).textContent=v;editing=null;save();render();});
  b.querySelector('#mQ').onchange=e=>{S.quant=e.target.value;save();toast(S.quant==='off'?'Cuantizar apagado':'Las próximas grabaciones se cuantizarán');};
  b.querySelector('#mQS').oninput=e=>{S.qStrength=+e.target.value;b.querySelector('#mQSv').textContent=S.qStrength+'%';save();};
  b.querySelector('#mRecs').onclick=openRecs;b.querySelector('#mSet').onclick=openSettings;
  b.querySelector('#mFull').onclick=()=>{closeAll();const d=document.documentElement;const p=d.requestFullscreen?d.requestFullscreen():null;
    if(p)p.then(()=>{try{screen.orientation.lock('landscape').catch(()=>{});}catch(e){}}).catch(()=>toast('Pantalla completa no disponible aquí'));else toast('Pantalla completa no disponible aquí');};
}
function openFx(anchor){const p=popover(anchor,`<div class="drow"><span>Reverb</span><button class="sw${S.reverb?' on':''}" id="fxOn" aria-label="Reverb"></button></div>
    <div class="srow" style="border:0"><div><b>Nivel de reverb: <span id="fxV">${S.reverbLevel}</span></b><input type="range" id="fxL" min="0" max="100" value="${S.reverbLevel}"></div></div>
    <div class="srow" style="border:0"><div><b>Volumen: <span id="volV">${S.volume}</span></b><input type="range" id="vol" min="10" max="100" value="${S.volume}"></div></div>`);
  p.querySelector('#fxOn').onclick=e=>{S.reverb=!S.reverb;e.currentTarget.classList.toggle('on',S.reverb);audio().apply();save();syncTop();};
  p.querySelector('#fxL').oninput=e=>{S.reverbLevel=+e.target.value;p.querySelector('#fxV').textContent=S.reverbLevel;audio().apply();save();};
  p.querySelector('#vol').oninput=e=>{S.volume=+e.target.value;p.querySelector('#volV').textContent=S.volume;audio().apply();save();};}
function openMetroPop(anchor){const p=popover(anchor,`<div class="drow"><span>Metrónomo</span><button class="sw${S.metro?' on':''}" id="mtOn" aria-label="Metrónomo"></button></div>
    <div class="srow" style="border:0"><div><b>BPM: <span id="mtV">${S.bpm}</span></b><input type="range" id="mtB" min="40" max="220" value="${S.bpm}"></div></div>
    <div class="srow" style="border:0"><div><b>Compás</b></div><select id="mtM">${[2,3,4,6].map(n=>`<option value="${n}"${S.meter===n?' selected':''}>${n===6?'6/8':n+'/4'}</option>`).join('')}</select></div>`);
  p.querySelector('#mtOn').onclick=e=>{S.metro=!S.metro;e.currentTarget.classList.toggle('on',S.metro);save();metroSync();};
  p.querySelector('#mtB').oninput=e=>{S.bpm=+e.target.value;p.querySelector('#mtV').textContent=S.bpm;save();};
  p.querySelector('#mtM').onchange=e=>{S.meter=+e.target.value;save();beatDots();};}

function openSettings(){
  const chk=(k,t,s)=>`<div class="srow"><div><b>${t}</b><small>${s}</small></div><button class="chk${S[k]?' on':''}" data-ck="${k}" aria-label="${t}"></button></div>`;
  const rng=(k,t,min,max)=>`<div class="srow"><div><b>${t}: <span data-rv="${k}">${S[k]}</span></b><input type="range" data-rg="${k}" min="${min}" max="${max}" value="${S[k]}"></div></div>`;
  const b=modal(`<div class="settings"><div class="shead"><button id="sBack" aria-label="Volver">${IC.back}</button>Ajustes</div>
    <div class="sgroup">Ajustes generales</div>${chk('countIn','Cuenta regresiva','Un compás de cuenta antes de grabar')}
    <div class="sgroup">Metrónomo</div>${chk('metro','Metrónomo','Suena mientras tocas y grabas')}${rng('bpm','Metrónomo BPM',40,220)}
    <div class="srow"><div><b>Modo metrónomo</b><small>Compás</small></div><select id="sMeter">${[2,3,4,6].map(n=>`<option value="${n}"${S.meter===n?' selected':''}>${n===6?'6/8':n+'/4'}</option>`).join('')}</select></div>
    <div class="sgroup">Reverb</div>${chk('reverb','Reverb','Usar el nivel de reverb de abajo')}${rng('reverbLevel','Nivel de reverb',0,100)}
    <div class="sgroup">Teclados</div>${rng('visible','Teclas blancas visibles',5,40)}${chk('resonance','Control de resonancia','Usar el tiempo de resonancia de abajo')}${rng('keyHold','Mantener (teclado)',0,100)}
    <div class="sgroup">Pad de acordes</div>${rng('padHold','Mantener (pads)',0,100)}
    <div class="srow"><div><b>Restablecer acordes</b><small>Vuelve a Dm Em F Am C Cm G D en una fila</small></div><button class="btn danger" id="sReset">Restablecer</button></div>
    <div class="sgroup">General</div>${rng('volume','Volumen',10,100)}
    <div class="srow"><div><b>Búfer de audio</b><small>Baja latencia responde más rápido. Si escuchas chasquidos, usa Normal o Estable.${ctx?` Latencia medida: ${Math.round(((ctx.baseLatency||0)+(ctx.outputLatency||0))*1000)} ms.`:''}</small></div><select id="sLat"><option value="low"${S.latency==='low'?' selected':''}>Baja latencia</option><option value="normal"${S.latency==='normal'?' selected':''}>Normal</option><option value="stable"${S.latency==='stable'?' selected':''}>Estable</option></select></div>
    <div class="srow"><div><b>Versión</b><small>Chord Live Pro ${APP_VERSION}</small></div></div>
    <div class="srow"><div><b>Carpeta de la app</b><small>${NATIVE?'Documentos/ChordLivePro (sf2, instrumentos y grabaciones exportadas)':'En el navegador los archivos quedan dentro del navegador y las exportaciones van a Descargas.'}</small></div></div>
    <div style="height:24px"></div></div>`);
  b.querySelector('#sBack').onclick=closeAll;
  b.querySelectorAll('[data-ck]').forEach(c=>c.onclick=()=>{const k=c.dataset.ck;S[k]=!S[k];c.classList.toggle('on',S[k]);save();if(E)E.apply();syncTop();metroSync();});
  b.querySelectorAll('[data-rg]').forEach(r=>r.oninput=()=>{const k=r.dataset.rg;S[k]=+r.value;b.querySelector(`[data-rv="${k}"]`).textContent=S[k];save();if(E)E.apply();if(k==='visible')keyboards.forEach(x=>x.layout());});
  b.querySelector('#sLat').onchange=async e=>{S.latency=e.target.value;save();if(ctx){REC=null;stopPlayback();clearInterval(metro.timer);metro.running=false;try{await ctx.close();}catch(_){}ctx=null;E=null;}audio();metroSync();toast('Audio reiniciado');};
  b.querySelector('#sMeter').onchange=e=>{S.meter=+e.target.value;save();beatDots();};
  let armed=false;b.querySelector('#sReset').onclick=e=>{if(!armed){armed=true;e.target.textContent='¿Seguro? Toca otra vez';return;}S.banks=[PRESETS[0].map(c=>({...c}))];S.perRow=8;editing=null;save();render();e.target.textContent='Listo';armed=false;};
}

/* =================== grabaciones =================== */
let recs=store.get('clp_recs',[]);const saveRecs=()=>store.set('clp_recs',recs);
let playing=null; // {id,bus,timer}
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function openRecs(){
  const b=modal(`<h2>Lista de grabaciones</h2><div id="recList"></div><div style="height:8px"></div>`);
  const list=b.querySelector('#recList');
  const draw=()=>{list.innerHTML='';if(!recs.length){list.innerHTML='<div class="empty">Aún no hay grabaciones.<br>Toca el botón rojo REC, toca algo y vuelve a tocarlo para guardar.</div>';return;}
    recs.slice().reverse().forEach(r=>{const row=el('div','recrow');const isP=playing&&playing.id===r.id;
      row.innerHTML=`<button class="ib play" aria-label="${isP?'Detener':'Reproducir'}">${isP?IC.stop:IC.play}</button><div class="rmain"><input value="${r.name.replace(/"/g,'&quot;')}" aria-label="Nombre"><span class="meta">${fmt(r.dur)} · ${r.bpm||'–'} BPM${r.quant&&r.quant!=='off'?' · cuantizada':''} · ${new Date(r.date).toLocaleDateString()}</span>
        <div class="xrow"><button class="xb" data-x="mid">MIDI</button><button class="xb" data-x="wav">WAV</button><button class="xb" data-x="mp3">MP3</button></div></div><button class="ib del" aria-label="Borrar">${IC.trash}</button>`;
      row.querySelectorAll('[data-x]').forEach(x=>x.onclick=()=>exportRec(r,x.dataset.x));
      row.querySelector('.play').onclick=()=>{if(isP)stopPlayback();else playRec(r,draw);draw();};
      row.querySelector('input').onchange=e=>{r.name=e.target.value.trim()||r.name;saveRecs();};
      const del=row.querySelector('.del');del.onclick=()=>{if(!del.classList.contains('armed')){del.classList.add('armed');del.setAttribute('aria-label','Toca otra vez para borrar');setTimeout(()=>del.classList.remove('armed'),2500);return;}
        if(playing&&playing.id===r.id)stopPlayback();recs=recs.filter(x=>x.id!==r.id);saveRecs();draw();};
      list.appendChild(row);});};
  draw();}
async function playRec(r,onEnd){stopPlayback();await ensureSounds(r);const e=audio(),bus=ctx.createGain();bus.connect(e.out);const t0=ctx.currentTime+.08;
  for(const ev of r.events){const v=e.play(ev.m,t0+ev.t,ev.v,ev.i,bus);if(ev.d!=null)v.stop(t0+ev.t+ev.d,ev.r||.1);}
  const timer=setTimeout(()=>{stopPlayback();onEnd&&onEnd();},(r.dur+2.5)*1000);playing={id:r.id,bus,timer};}
function stopPlayback(){if(!playing)return;const p=playing;playing=null;clearTimeout(p.timer);try{p.bus.gain.setTargetAtTime(0,ctx.currentTime,.03);setTimeout(()=>p.bus.disconnect(),200);}catch(e){}}

/* =================== metrónomo + REC =================== */
let metro={timer:null,next:0,beat:0};
const center=$('#center');
function beatDots(){center.querySelectorAll('.beat').forEach(b=>b.remove());if(!S.metro&&!(REC))return;for(let i=0;i<S.meter;i++){const d=el('span','beat'+(i===0?' acc':''));center.appendChild(d);}}
function metroSync(){syncTop();clearInterval(metro.timer);metro.timer=null;
  const need=S.metro||(REC&&REC.waiting);beatDots();if(!need||!ctx)return;
  if(!metro.running){metro.next=ctx.currentTime+.06;metro.beat=0;}
  metro.timer=setInterval(tick,25);metro.running=true;}
function tick(){if(!ctx)return;const spb=60/S.bpm*(S.meter===6?.5:1);
  while(metro.next<ctx.currentTime+.12){const acc=metro.beat%S.meter===0;E.click(metro.next,acc);const b=metro.beat%S.meter,when=(metro.next-ctx.currentTime)*1000;
    setTimeout(()=>{const ds=center.querySelectorAll('.beat');ds.forEach((d,i)=>d.classList.toggle('hit',i===b));},Math.max(0,when));
    metro.next+=spb;metro.beat++;}
  if(!S.metro&&!(REC&&REC.waiting)){clearInterval(metro.timer);metro.running=false;}}
let recTick=null;
function startRec(){audio();const btn=$('#btnRec');const withDrums=S.recDrums;
  if(S.countIn){const spb=60/S.bpm*(S.meter===6?.5:1),beats=S.meter,t0=ctx.currentTime+.15;
    REC={t0:t0+beats*spb,events:[],waiting:true};btn.classList.add('recording');
    const ov=$('#countIn'),sp=ov.querySelector('span');
    for(let i=0;i<beats;i++){const t=t0+i*spb;E.click(t,i===0);setTimeout(()=>{ov.hidden=false;sp.textContent=beats-i;},(t-ctx.currentTime)*1000);}
    if(S.metro){clearInterval(metro.timer);metro.next=REC.t0;metro.beat=0;metro.running=true;metro.timer=setInterval(tick,25);}
    setTimeout(()=>{ov.hidden=true;if(REC)REC.waiting=false;recClock();},(REC.t0-ctx.currentTime)*1000);
  }else{REC={t0:ctx.currentTime+.03,events:[],waiting:false};btn.classList.add('recording');recClock();}
  REC.drums=withDrums;if(withDrums&&!DM.playing){REC.startedDrums=true;dmStart(REC.t0);}
  toast(withDrums?'Grabando con caja de ritmos':'Grabando sin caja de ritmos');
}
function recClock(){let t=el('span','rectime');center.prepend(t);const upd=()=>{if(!REC){t.remove();return;}t.textContent='● '+fmt(ctx.currentTime-REC.t0);};upd();recTick=setInterval(upd,250);}
function stopRec(){const r=REC;REC=null;if(r&&r.startedDrums)dmStop();clearInterval(recTick);center.querySelectorAll('.rectime').forEach(x=>x.remove());$('#btnRec').classList.remove('recording');$('#countIn').hidden=true;
  if(!r||r.waiting){toast('Grabación cancelada');return;}
  const now=ctx.currentTime-r.t0;r.events.forEach(ev=>{if(ev.d==null&&ev.r==null){} });
  if(!r.events.some(e=>e.i!=='drum')&&!r.drums){toast('No se grabó ninguna nota');return;}
  if(!r.events.length){toast('No se grabó nada');return;}
  const dur=Math.max(now,...r.events.map(e=>e.t+(e.d||1)));
  const evs=quantize(r.events.filter(e=>e.i!=='drum'),S.bpm,S.quant).concat(r.events.filter(e=>e.i==='drum'));const n=recs.length+1;
  recs.push({id:Date.now(),name:'Grabación '+n,date:Date.now(),dur,bpm:S.bpm,meter:S.meter,quant:S.quant,drums:!!r.drums,events:evs});saveRecs();
  toast('Guardada en Lista de grabaciones'+(S.quant!=='off'?' (cuantizada)':''));}

/* =================== barra superior =================== */
$('#btnBack').onclick=()=>{if(layer.firstChild){closeAll();return;}if(drumView){drumView=false;render();return;}if(editing){editing=null;render();return;}$('#splash').hidden=false;};
$('#btnGo').onclick=()=>{audio();$('#splash').hidden=true;metroSync();prepareInstrument(S.inst);prepareDrums(S.kit);};
const mt=$('#btnMetro');let mtLP=null,mtLong=false;
mt.addEventListener('pointerdown',()=>{mtLong=false;mtLP=setTimeout(()=>{mtLong=true;openMetroPop(mt);},500);});
mt.addEventListener('pointerup',()=>clearTimeout(mtLP));mt.addEventListener('pointerleave',()=>clearTimeout(mtLP));
mt.addEventListener('click',()=>{if(mtLong)return;audio();S.metro=!S.metro;save();metroSync();toast(S.metro?`Metrónomo ${S.bpm} BPM · mantén pulsado para ajustar`:'Metrónomo apagado');});
mt.addEventListener('contextmenu',e=>e.preventDefault());
const rb=$('#btnRec');let rbLP=null,rbLong=false;
rb.addEventListener('pointerdown',()=>{rbLong=false;if(REC)return;rbLP=setTimeout(()=>{rbLong=true;openRecOptions(rb);},500);});
rb.addEventListener('pointerup',()=>clearTimeout(rbLP));rb.addEventListener('pointerleave',()=>clearTimeout(rbLP));
rb.onclick=()=>{if(rbLong)return;if(REC)stopRec();else{stopPlayback();startRec();}};
const db=$('#btnDrum');let dbLP=null,dbLong=false;
db.addEventListener('pointerdown',()=>{dbLong=false;dbLP=setTimeout(()=>{dbLong=true;DM.playing?dmStop():dmStart();toast(DM.playing?'Ritmo detenido':'Ritmo sonando');},500);});
db.addEventListener('pointerup',()=>clearTimeout(dbLP));db.addEventListener('pointerleave',()=>clearTimeout(dbLP));
db.onclick=()=>{if(dbLong)return;drumView=!drumView;editing=null;render();};
$('#btnFx').onclick=e=>openFx(e.currentTarget);
$('#btnSus').onclick=()=>{S.sus=!S.sus;save();syncTop();toast(S.sus?'Sustain activado':'Sustain desactivado');};
$('#btnMode').onclick=()=>{drumView=false;openModes();};$('#btnLabels').onclick=openLabels;$('#btnInst').onclick=openInst;$('#btnMenu').onclick=openMenu;
document.addEventListener('contextmenu',e=>e.preventDefault());
window.addEventListener('resize',()=>keyboards.forEach(k=>k.layout()));
$('#splashVer').textContent='Versión '+APP_VERSION;
/* =================== teclado de la computadora =================== */
const KMAP={KeyA:0,KeyW:1,KeyS:2,KeyE:3,KeyD:4,KeyF:5,KeyT:6,KeyG:7,KeyY:8,KeyH:9,KeyU:10,KeyJ:11,KeyK:12,KeyO:13,KeyL:14,KeyP:15,Semicolon:16,Quote:17};
const kHeld=new Map();let kOct=S.kOct||4;
const kbVisual=(m,on)=>{for(const k of keyboards){const e=k.els[m];if(e)e.classList.toggle('down',on);}};
const padByKey=(code,shift)=>{const d=/^Digit(\d)$/.exec(code);if(!d)return null;const i=(+d[1]+9)%10,b=shift?1:0;return S.banks[b]&&S.banks[b][i]?{b,i}:null;};
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(layer.firstChild)closeAll();else if(editing){editing=null;render();}else if(drumView){drumView=false;render();}return;}
  const tg=e.target;if(tg&&(tg.tagName==='INPUT'||tg.tagName==='SELECT'||tg.tagName==='TEXTAREA'))return;
  if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||!$('#splash').hidden)return;
  if(e.code==='KeyZ'){kOct=clamp(kOct-1,1,7);S.kOct=kOct;save();toast('Teclado de la PC: octava '+kOct);return;}
  if(e.code==='KeyX'){kOct=clamp(kOct+1,1,7);S.kOct=kOct;save();toast('Teclado de la PC: octava '+kOct);return;}
  if(e.code==='Space'){e.preventDefault();DM.playing?dmStop():dmStart();return;}
  if(kHeld.has(e.code))return;
  if(e.code in KMAP){const m=12*(kOct+1)+KMAP[e.code];kHeld.set(e.code,{h:noteOn(m,.8),m});kbVisual(m,true);buzz();return;}
  const pd=padByKey(e.code,e.shiftKey);if(pd){const ch=S.banks[pd.b][pd.i];const ns=cellNotes(ch,'head');const nv=.68*Math.min(1,1.7/Math.sqrt(ns.length));
    kHeld.set(e.code,{hs:ns.map((m,k)=>noteOn(m,nv,k*.018))});
    document.querySelectorAll(`.cell.head[data-b="${pd.b}"][data-c="${pd.i}"]`).forEach(x=>x.classList.add('hit'));}
});
document.addEventListener('keyup',e=>{const h=kHeld.get(e.code);if(!h)return;kHeld.delete(e.code);
  if(h.h){noteOff(h.h,'key');if(![...kHeld.values()].some(x=>x.m===h.m))kbVisual(h.m,false);}
  if(h.hs){h.hs.forEach(x=>noteOff(x,'pad'));document.querySelectorAll('.cell.head.hit').forEach(x=>x.classList.remove('hit'));}});
window.addEventListener('blur',()=>{for(const [c,h] of kHeld){if(h.h){noteOff(h.h,'key');kbVisual(h.m,false);}if(h.hs)h.hs.forEach(x=>noteOff(x,'pad'));}kHeld.clear();});
if(DESKTOP){$('.tag').textContent='Toca con el ratón o con el teclado: A W S E D F T G Y H U J K O L P son las teclas del piano, Z y X cambian de octava, 1 al 0 tocan los acordes (Mayús para la segunda fila) y la barra espaciadora arranca el ritmo. ESC sale de pantalla completa y F11 vuelve.';}
render();
loadCustomList().then(()=>{if(S.inst.startsWith('sf:'))loadCustom(S.inst).catch(()=>{S.inst='piano';save();});});
})();
</script>
